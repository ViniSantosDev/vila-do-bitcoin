<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vila do Bitcoin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" href="/css/game.css"/>
</head>
<body>
<div class="container">
    <div style="text-align:right; margin-bottom:.5rem;">
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
    </div>
    <div class="home-card">
        <div style="font-size:3rem; margin-bottom:1rem;">🏘️₿</div>
        <h1>Vila do Bitcoin</h1>
        <p>Aprenda o que é Bitcoin construindo uma vila, trocando coisas e descobrindo por que o dinheiro de verdade precisa ser diferente!</p>

        <form action="/start" method="post">
            <input
                class="name-input"
                type="text"
                name="name"
                placeholder="Qual é o seu nome? 👦👧"
                maxlength="30"
                autocomplete="off"
            />
            <button type="submit" class="btn btn-primary btn-full">
                🚀 Começar a aventura!
            </button>
        </form>
    </div>
</div>
</body>
<script>
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        applyTheme(next);
    }

    (function () {
        const saved = localStorage.getItem('theme') || 'light';
        applyTheme(saved);
    })();
</script>
</html>
