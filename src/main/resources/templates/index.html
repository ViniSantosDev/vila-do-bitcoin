<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vila do Bitcoin</title>
    <link rel="stylesheet" href="/css/game.css"/>
</head>
<body>
<div class="container">
    <div class="home-card">
        <div style="font-size:3rem; margin-bottom:1rem;">🏘️₿</div>
        <h1>Vila do Bitcoin</h1>
        <p>Aprenda o que é Bitcoin construindo uma vila, trocando coisas e descobrindo por que o dinheiro de verdade precisa ser diferente!</p>

        <form action="/start" method="post">
            <input
                class="name-input"
                type="text"
                name="name"
                placeholder="Qual é o seu nome? 👦👧"
                maxlength="30"
                autocomplete="off"
            />
            <button type="submit" class="btn btn-primary btn-full">
                🚀 Começar a aventura!
            </button>
        </form>
    </div>
</div>
</body>
</html>
