<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Vila do Bitcoin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" href="/css/game.css"/>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="container">

    <div class="game-header">
        <div>🏘️ <strong>Vila do Bitcoin</strong></div>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="game-header h2">Olá, <span th:text="${player.name}">Jogador</span>! 👋</div>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
        </div>
    </div>

    <!-- Área do jogo-->
    <div id="game-area">
        <div th:switch="${player.currentPhase}">
            <div th:case="1"><div th:replace="~{fragments/phase1 :: content(${player})}"></div></div>
            <div th:case="2"><div th:replace="~{fragments/phase2 :: content(${player}, ${breadPrice}, ${totalGold}, ${iptu}, ${ipva})}"></div></div>
            <div th:case="3"><div th:replace="~{fragments/phase3 :: content(${player})}"></div></div>
            <div th:case="4"><div th:replace="~{fragments/phase4 :: content(${player})}"></div></div>
        </div>
    </div>
    <!-- Reiniciar -->
    <div style="text-align:center; margin-top:2rem;">
        <form th:action="@{/game/{id}/reset(id=${player.id})}" method="post">
            <button type="submit" class="btn" style="font-size:12px; color:#999;">
                🔄 Reiniciar jogo
            </button>
        </form>
    </div>

</div>
</body>
<script>
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        applyTheme(next);
    }

    (function () {
        const saved = localStorage.getItem('theme') || 'light';
        applyTheme(saved);
    })();
</script>
</html>
