spring:
  datasource:
    url: jdbc:h2:mem:bitcoingame
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

app:
  lightning-address: ${LIGHTNING_ADDRESS}